services:
  website:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEBSITE_PORT:-80}:80"
    environment:
      PORT: "80"
      HOSTNAME: "0.0.0.0"
      GOOGLE_SHEET_ID: "${GOOGLE_SHEET_ID:-}"
      GOOGLE_SERVICE_ACCOUNT_EMAIL: "${GOOGLE_SERVICE_ACCOUNT_EMAIL:-}"
      GOOGLE_PRIVATE_KEY: "${GOOGLE_PRIVATE_KEY:-}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:80').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  tunnel:
    image: cloudflare/cloudflared:2026.7.1
    user: "1000:1000"
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    depends_on:
      website:
        condition: service_healthy
    volumes:
      - ./deploy/cloudflared.yml:/etc/cloudflared/config.yml:ro
      - /home/nguyen/.cloudflared/d2dad707-48a8-4e89-98a6-9a27fe352478.json:/etc/cloudflared/tunnel.json:ro
